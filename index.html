<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="calculator">
        <div id="screen"></div>
        <div class="row">
            <div class="key special" id="AC">AC</div>
            <div class="key special" id="DEL">&larr;</div>
        </div>
        <div class="row">
            <div class="key number" id="7">7</div>
            <div class="key number" id="8">8</div>
            <div class="key number" id="9">9</div>
            <div class="key operator" id="sum">÷</div>
        </div>
        <div class="row">
            <div class="key number" id="4">4</div>
            <div class="key number" id="5">5</div>
            <div class="key number" id="6">6</div>
            <div class="key operator" id="multiplication">x</div>
        </div>
        <div class="row">
            <div class="key number"  id="1">1</div>
            <div class="key number" id="2">2</div>
            <div class="key number" id="3">3</div>
            <div class="key operator" id="minus">-</div>
        </div>
        <div class="row">
            <div class="key" id="decimal">.</div>
            <div class="key number" id="0">0</div>
            <div class="key special" id="equal">=</div>
            <div class="key operator" id="plus">+</div>
        </div>
    </div>
</body>
</html>
